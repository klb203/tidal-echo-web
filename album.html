<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7FAFC">
<title>图片记忆 · 正在打开…</title>
<!--
  ⚠️ 这个文件**不再包含相册本身**。

  原来「图片记忆」是这里的独立页面，侧边栏点 Album 就 location.assign 过来。
  代价是：每进一次相册就是整页重载；点返回又要把 index.html 整个重新加载一遍，
  于是会再走一次开屏/连接密钥那屏，最后落到聊天 —— 用户看到的就是这个。

  现在相册是宿主里的一个**整页面板**（album-pack.css + album-pack.js），
  进 = 盖一层，回 = 关一层，不重载、不掉会话、跟着宿主主题走。

  这个文件保留下来只做一件事：把老书签/老链接送进 App 的相册面板。
  真正的实现在 album-pack.js —— 别再往这里抄一份，抄了就会有两份对不上。
-->
<script>
  /* replace：不留历史，避免用户按返回又被弹回来 */
  location.replace("index.html?open=album");
</script>
<style>
  html,body{ margin:0; height:100%; background:#F7FAFC; color:#253447;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif; }
  .w{ height:100%; display:grid; place-items:center; text-align:center; padding:24px; }
  .w p{ font-size:14px; color:#5E7080; line-height:1.9; margin:0; }
  .w a{ color:#2C4056; }
</style>
</head>
<body>
<div class="w">
  <p>正在打开「图片记忆」…<br>
    <span style="font-size:12.5px;color:#8A99A8">没自动跳的话，<a href="index.html?open=album">点这里</a></span></p>
</div>
</body>
</html>
